[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "arogya-vahi"
version = "0.1.0"
description = "Keeps a family's lab reports in one place and reads them with local Gemma; reports never leave the laptop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf~=1.28.2",
    "ollama~=0.6.3",
    "httpx~=0.28.1",
    "pydantic~=2.13.5",
    "pydantic-settings~=2.15",
    "python-dateutil~=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.1",
    "hypothesis~=6.168",
    "ruff~=0.16",
]

[project.scripts]
arogya-extract = "app.extract:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.txt", "schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"   # list skipped tests with their reason (e.g. the live Gemma test)
filterwarnings = ["error"]   # a new warning fails the suite instead of scrolling past

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]   # "µ", "·", "×" and Devanagari are intentional
