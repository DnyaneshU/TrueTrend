name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check arogya_vahi tests
      - run: ruff format --check arogya_vahi tests
      - run: python -m pytest

  package:
    name: Installed wheel runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build && python -m build --wheel
      - name: Install the wheel in a clean environment and run it outside the checkout
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/arogya-recheck --help
          AROGYA_STORAGE_DIR=/tmp/arogya /tmp/clean/bin/arogya-recheck
          AROGYA_STORAGE_DIR=/tmp/arogya /tmp/clean/bin/arogya-summary --json
