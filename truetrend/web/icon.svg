<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img"
     aria-label="TrueTrend">
  <title>TrueTrend</title>
  <desc>A notebook page with a rising line read off it, and the point that is checked.</desc>

  <defs>
    <!-- The app's two colours, in the one gradient it uses. -->
    <linearGradient id="tt-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ad4c4" />
      <stop offset="1" stop-color="#4b8cff" />
    </linearGradient>
  </defs>

  <!-- The notebook: a page with a spine, because the product is a vahi, a notebook.
       The spine is drawn inside the outline so it survives at small sizes. -->
  <rect x="14" y="10" width="68" height="76" rx="11"
        fill="none" stroke="url(#tt-edge)" stroke-width="4.5" />
  <path d="M30 14v68" stroke="url(#tt-edge)" stroke-width="4" opacity="0.5"
        stroke-linecap="round" />

  <!-- The reading taken off the page: four points, rising, the last one the newest. -->
  <path d="M42 68 L53 52 L61 58 L72 36" fill="none" stroke="#ff5d8f" stroke-width="5.5"
        stroke-linecap="round" stroke-linejoin="round" />

  <!-- The value that was checked against the report. The whole product is this dot. -->
  <circle cx="72" cy="36" r="5.5" fill="#ff5d8f" />
  <circle cx="72" cy="36" r="10" fill="none" stroke="#ff5d8f" stroke-width="2" opacity="0.4" />
</svg>
