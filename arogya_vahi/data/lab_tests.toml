# The lab tests Arogya Vahi reads from reports, and the words labs print.
#
# Editing this file changes what is extracted and how Gemma's answers are checked;
# no code changes are needed.
#
# Each [[tests]] entry:
#   code       the code results are saved under
#   name       its plain-English name
#   name_mr    its name in the Marathi summary
#   prompt     how the prompt describes the test to Gemma
#   names      a printed test name must contain one of these words or phrases...
#   not_names  ...and none of these: look-alike tests labs print nearby
#   unit       the standard unit results are converted to
#   units      each unit a lab may print -> how to convert it to the standard unit:
#              a number to multiply by, or { divide = n } / { multiply = n, offset = n }.
#              Units are compared case- and spacing-insensitively, with µ, u and
#              "micro" treated alike ("µIU/mL" = "uIU/ml" = "microIU/mL").
#   plausible  [low, high] in the standard unit: limits a real result stays within, far
#              wider than any normal range. They only catch misreadings, such as a dropped
#              decimal point (HbA1c 69 % for 6.9 %) or a wrong unit; a result outside
#              them is kept but marked for checking. They are sanity limits, not
#              clinical thresholds.
#   variation  { cvi, cva, between_lab_cv, source }: how much the result varies with no
#              real change, as CVs in % (within-person, one lab's analytical, and between
#              labs), for the Reference Change Value in arogya_vahi/change.py. Every number must
#              come from the cited source; leave the field out when none is known, and
#              changes in that test are then not judged. CVa is EFLM's minimum standard,
#              0.75 x CVi, for a lab's own precision is unknown: assuming a lab only just
#              meets it errs towards "normal variation". A between-lab CV from external
#              quality assessment already includes each lab's own imprecision, so adding it
#              to CVa overstates the variation a little: two-lab changes are judged
#              conservatively, never too eagerly.
#
# Conversion factors follow from molar masses: glucose (180.16 g/mol) x 18.016,
# cholesterol (386.65) x 38.67, triglycerides (as triolein, 885.7) x 88.57, creatinine
# (113.12) / 88.4, 25-OH vitamin D (400.64) / 2.496, free T4 (776.9) x 0.0777, urea
# (60.06) x 6.006, uric acid (168.1) / 59.48, vitamin B12 (1355.4) x 1.355. HbA1c IFCC
# mmol/mol -> NGSP % is the IFCC-NGSP master equation, 0.0915 x IFCC + 2.15.
#
# Names are compared after normalising spelling: case is ignored, punctuation becomes
# a space, dotted abbreviations are joined ("T.S.H." = "TSH"), and letters are split
# from digits ("B-12" = "B12" = "B 12"). Words and phrases match whole words only.

# Listed in the prompt as tests Gemma must not return.
prompt_exclusions = [
    "Total T4 or T4", "T3", "LDL/HDL or other ratios", "VLDL", "non-HDL cholesterol",
    "Estimated Average Glucose", "Mean Blood Glucose", "Random Blood Sugar", "MCH", "MCHC",
    "haemoglobin fractions (Hb A, Hb A2, HbF)", "BUN / Blood Urea Nitrogen", "any urine test",
]

[report]
# High/low marks labs print in the same cell as the value ("H 168.0", "18.0 L").
flags = ["HH", "LL", "H", "L"]
# What Gemma sometimes writes instead of leaving a field empty.
empty_words = ["null", "none", "n/a", "-"]
# A reference range is read only when it has no label or one of these; other labels
# ("Low: <40", "Deficiency: <10") are risk categories, not the normal range.
normal_range_labels = ["normal", "desirable", "optimal", "reference", "ref", "reference range",
                       "biological reference interval", "bio ref interval", "adult", "adults"]

# How results on one report are checked against each other (arogya_vahi/verify.py).
[checks]
# A part can't be more than its total: LDL and HDL are parts of total cholesterol.
# When it is, both results are marked for checking.
parts_of = { CHOL = ["LDL", "HDL"] }
# The two below only add a note to the result; they never mark it wrong.
# Friedewald: LDL is about total cholesterol - HDL - triglycerides / 5 (all mg/dL), a
# formula that holds only while triglycerides are below friedewald_max_tg. A note is added
# when the lab's LDL differs from it by more than friedewald_tolerance (a share of it).
friedewald_max_tg = 400
friedewald_tolerance = 0.2
# ADAG: HbA1c corresponds to an average glucose of 28.7 x HbA1c - 46.7 mg/dL. A note is
# added when fasting glucose on the same report differs from it by more than adag_tolerance.
adag_tolerance = 0.3

[[tests]]
code = "HBA1C"
name = "HbA1c"
name_mr = "HbA1c (सरासरी साखर)"
prompt = "HbA1c, Glycated / Glycosylated Haemoglobin"
names = ["HbA1c", "A1c", "glycated", "glycosylated", "glycohaemoglobin", "glycohemoglobin"]
not_names = []
unit = "%"
units = { "%" = 1, "mmol/mol" = { multiply = 0.0915, offset = 2.15 } }
plausible = [3, 20]
[tests.variation]
cvi = 1.2
cva = 0.9
between_lab_cv = 3.0
source = "CVI: EFLM Biological Variation Database, Haemoglobin A1c (NGSP), CVI median 1.173, n=6, https://biologicalvariation.eu/api/meta_calculations/meta_by_analyte/1641 (accessed 2026-10-03). CVA: 0.75 x CVI, the EFLM minimum analytical performance specification (a lab just meeting it; most labs are more precise, so changes are judged cautiously). Between-lab CV: CAP GH5-A survey 2024, all-method CV 2.6-3.0 % (upper bound), https://ngsp.org/docs/CAC2024.pdf."

[[tests]]
code = "GLU_F"
name = "Fasting glucose"
name_mr = "उपाशीपोटी साखर"
prompt = "Fasting blood or plasma glucose, FBS, Fasting Blood Sugar"
names = ["fasting", "FBS", "FBG", "FPG", "F"]
not_names = ["estimated", "average", "mean", "random", "RBS", "post", "prandial", "postprandial",
             "PP", "PPBS", "urine", "urinary"]
unit = "mg/dL"
units = { "mg/dL" = 1, "mmol/L" = 18.016 }
plausible = [10, 1500]
[tests.variation]
cvi = 4.7
cva = 3.5
between_lab_cv = 4.4
source = "CVI: EFLM Biological Variation Database, Glucose, CVI median 4.669, n=12, https://biologicalvariation.eu/api/meta_calculations/meta_by_analyte/1518 (accessed 2026-10-03). CVA: 0.75 x CVI, the EFLM minimum analytical performance specification (a lab just meeting it; most labs are more precise, so changes are judged cautiously). Between-lab CV: China NCCL national EQA 2006, all-method interlaboratory CV (~900 labs), https://bipm.org/documents/20126/51140418/working-document-ID-896/829987b1-9d66-6a0e-b97c-bd0d2a1b1cc2."

[[tests]]
code = "GLU_PP"
name = "Post-prandial glucose"
name_mr = "जेवणानंतरची साखर"
prompt = "Post-prandial glucose, PPBS, PP blood sugar, 2-hour glucose"
names = ["post", "prandial", "postprandial", "PP", "PPBS", "PPBG", "2 hr", "2 hrs", "2 hour",
         "2 hours", "two hour", "two hours"]
not_names = ["estimated", "average", "mean", "random", "RBS", "fasting", "urine", "urinary"]
unit = "mg/dL"
units = { "mg/dL" = 1, "mmol/L" = 18.016 }
plausible = [10, 1500]
# No variation: the EFLM database has no post-prandial glucose entry, so its changes aren't judged.

[[tests]]
code = "TSH"
name = "TSH"
name_mr = "TSH (थायरॉईड)"
prompt = "TSH, Thyroid Stimulating Hormone (including ultrasensitive TSH)"
names = ["TSH", "thyroid stimulating"]
not_names = ["T3", "T4", "FT3", "FT4"]
unit = "µIU/mL"
# "mlU/L" is how some lab fonts print mIU/L
units = { "µIU/mL" = 1, "mIU/L" = 1, "mlU/L" = 1 }
plausible = [0, 1000]
[tests.variation]
cvi = 17.8
cva = 13.4
source = "CVI: EFLM Biological Variation Database, TSH, CVI median 17.817, n=7, https://biologicalvariation.eu/api/meta_calculations/meta_by_analyte/1065 (accessed 2026-10-03). CVA: 0.75 x CVI, the EFLM minimum analytical performance specification (a lab just meeting it; most labs are more precise, so changes are judged cautiously)."

