<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 128" width="520" height="128" role="img"
     aria-label="TrueTrend — आरोग्य वही">
  <title>TrueTrend</title>
  <desc>The mark beside the name, in both scripts.</desc>

  <defs>
    <linearGradient id="ttw-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ad4c4" />
      <stop offset="1" stop-color="#4b8cff" />
    </linearGradient>
    <linearGradient id="ttw-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ad4c4" />
      <stop offset="1" stop-color="#4b8cff" />
    </linearGradient>
  </defs>

  <!-- The mark, at the same proportions as logo.svg. -->
  <g transform="translate(18, 20) scale(0.92)">
    <rect x="4" y="2" width="64" height="76" rx="10"
          fill="none" stroke="url(#ttw-edge)" stroke-width="4.5" />
    <path d="M19 2v76" stroke="url(#ttw-edge)" stroke-width="4.5" opacity="0.4"
          stroke-linecap="round" />
    <path d="M29 58 L40 42 L48 48 L59 26" fill="none" stroke="#ff5d8f" stroke-width="5.5"
          stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="59" cy="26" r="5.5" fill="#ff5d8f" />
    <circle cx="59" cy="26" r="10" fill="none" stroke="#ff5d8f" stroke-width="2" opacity="0.35" />
  </g>

  <!-- The name, in both scripts: what it is called, and what she calls it. -->
  <text x="112" y="62" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="44" font-weight="700" letter-spacing="-1.2" fill="url(#ttw-word)">TrueTrend</text>
  <text x="114" y="92" font-family="'Noto Sans Devanagari', 'Nirmala UI', sans-serif"
        font-size="20" fill="#5f6a80">आरोग्य वही</text>
</svg>
